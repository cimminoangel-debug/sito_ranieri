<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portale Artista - Sito Ufficiale{% endblock %}</title>
    <!-- Bootstrap 5.0 CDN Sicura -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0"
      crossorigin="anonymous"
    />
    <style>
        body { background-color: #f8f9fa; color: #212529; }
        .navbar-custom { background-color: #4a1525; } /* Rosso bordeaux teatrale */
        .btn-teatro { background-color: #800020; color: white; }
        .btn-teatro:hover { background-color: #4a1525; color: white; }
        .hero-section { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://unsplash.com') no-repeat center/cover; color: white; padding: 60px 0; }
    </style>
</head>
<body>

    <!-- Barra di Navigazione Comune -->
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4">
        <div class="container">
            <!-- Brand principale -->
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Artista Official</a>
            
            <!-- Pulsante Hamburger (visibile SOLO su Smartphone e Tablet) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Contenitore dei Link (si contrae su mobile, si espande su desktop) -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-item nav-link text-white me-3" href="{% url 'home' %}">Home</a>
                    <a class="nav-item nav-link text-white me-3" href="{% url 'biografia' %}">Biografia</a>
                    <a class="nav-item nav-link text-white me-3" href="{% url 'discografia' %}">Discografia</a>
                    <a class="nav-item nav-link text-white" href="{% url 'lista_partecipanti' %}">Lista Biglietti</a>

                    <!-- SEZIONE PROTETTA: Visibile solo allo staff loggato -->
                    {% if user.is_staff %}
                        <a class="nav-item nav-link text-warning me-3 fw-bold" href="{% url 'lista_partecipanti' %}">📋 Registro Biglietti</a>
                        <a class="nav-item nav-link text-warning me-3 fw-bold" href="{% url 'dashboard_scanner' %}">📷 Scanner Varchi</a>
                        <!-- Form per il Logout sicuro (richiede POST nelle ultime versioni di Django) -->
                        <form action="{% url 'admin:logout' %}" method="POST" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link nav-item nav-link text-white-50 d-inline p-0 border-0 align-baseline">
                                🚪 Esci ({{ user.username }})
                            </button>
                        </form>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenuto Dinamico delle Pagine Sotto-stanti -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pié di pagina -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p class="mb-0">&copy; 2026 Portale Artista Ufficiale. Tutti i diritti riservati.</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
      crossorigin="anonymous"
    ></script>

</body>
</html>
